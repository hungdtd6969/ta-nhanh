const U=[
{n:"Unit 1 – Shopping Psychology",
v:["assume|v|to expect something to be true|cho rằng, giả định","bargain|n|something bought for a lower price than usual|món hời","commercial|adj|related to business|thuộc thương mại","complex|adj|hard to understand or analyze|phức tạp","consumer|n|a person who buys goods or services|người tiêu dùng","factor|n|one of the things that affects a situation or decision|yếu tố","focus on|v phr|to pay particular attention to|tập trung vào","influence|v|to have an effect on something or someone|ảnh hưởng","purchase|n|an item that one buys|món hàng mua","react to|v phr|to do something in response to an experience|phản ứng với","retailer|n|a business that sells goods to consumers|nhà bán lẻ","trick|n|a somewhat dishonest way of getting a result|mẹo, chiêu","decoy|n|something used to attract attention so people won't notice something else|mồi nhử","tempt|v|to persuade or convince|cám dỗ","aware|adj|knowing about or realizing something|nhận thức được","concerned|adj|worried|lo lắng","debt|n|money owed to another person or a bank|khoản nợ","estimate|v|to calculate the size or number of something approximately|ước tính","fascinating|adj|very interesting|hấp dẫn","limit|v|to keep something within or below a certain amount|hạn chế","productive|adj|able to produce or accomplish a lot|có năng suất","shortage|n|a situation of not having enough|sự thiếu hụt","substitute|n|something that replaces something else|vật thay thế","treat|v|to buy something special for yourself or another person|đãi, chiêu đãi"],
k:[["Listening: Identify Main Ideas and Details","Nghe kỹ phần mở đầu & kết luận (ý chính thường nằm ở đó); chú ý từ/cụm lặp lại; chú ý câu hỏi của người nói. Chi tiết: nghe ví dụ, thông tin mới giải thích ý chính."],["Note-taking: Use an Outline","Ý chính ghi bên trái bằng chữ/số (A, B…); chi tiết thụt vào bên dưới và đánh số (1, 2, 3)."],["Speaking: Use Tag Questions","Câu khẳng định + tag phủ định; câu phủ định + tag khẳng định. Dùng để (1) thuyết phục người nghe đồng ý, (2) tạo sự kết nối với khán giả. VD: It's worrying, isn't it? / You don't like spicy food, do you?"],["Pronunciation: Primary Stress in Words","2 âm tiết: danh từ/tính từ nhấn âm 1 (PRESent, SHOPping); động từ nhấn âm cuối (preSENT, deCIDE, reACT). Đuôi -ic, -sion, -tion: nhấn âm kế cuối (eLECtronic, conCLUsion). Đuôi -cy, -ty, -phy, -gy, -al: nhấn âm thứ 3 từ cuối (deMOCracy, phoTOgraphy, psyCHOlogy)."],["Vocab skill: Participial Adjectives","-ing = gây ra cảm xúc (boring, frustrating); -ed = người cảm thấy cảm xúc (bored, frustrated)."],["Critical Thinking: Positive & Negative Consequences","Trước khi hành động, cân nhắc hậu quả tích cực và tiêu cực (VD: dùng thẻ tín dụng → có đồ mới, nhưng mắc nợ)."],["Collaboration: Group Discussion","DO: cho mọi người cơ hội nói, thể hiện quan tâm (eye contact, gật đầu), tôn trọng ý kiến. DON'T: ngắt lời, phớt lờ (chơi điện thoại), lo sợ nói trước người khác."],["Nội dung nghe/video","Decoy effect: ly nhỏ $1, lớn $2 → thêm ly vừa (mồi nhử) → người ta mua ly lớn. Sale signs, BOGO (buy one get one) khiến mua nhiều hơn cần. No Buy Year: e-waste, quần áo polyester thải vi nhựa ra đại dương, tiết kiệm tiền, bảo vệ môi trường."]],
g:[["Present real conditional","If/When/Whenever + simple present, simple present (điều luôn đúng). If I buy something on sale, I feel happy."],["Future real conditional","If + simple present, will/may/might/can + V. If the price drops, I will buy it."],["Present unreal conditional","If + simple past, would/could/might + V. Dùng WERE cho mọi ngôi. If the price were lower, I would buy a new laptop."]],
q:[["If I ___ a lot of money, I would travel the world.","had"],["If it ___ sunny, my mood improves.","is"],["You've taken this course, ___ you? (tag)","haven't"],["You don't like spicy food, ___ you? (tag)","do"]]},
{n:"Unit 2 – It's in My DNA",
v:["adapt|v|to change your behavior to deal with a new situation|thích nghi","affect|v|to have an impact on someone or something|ảnh hưởng","be exposed to|v phr|to be given experience of|được tiếp xúc với","cautious|adj|careful in order to avoid danger or mistakes|thận trọng","circumstances|n|the conditions connected to a situation|hoàn cảnh","determine|v|to decide; make clear|quyết định, xác định","identical|adj|exactly the same|giống hệt","investigate|v|to carefully examine or research|điều tra, nghiên cứu","trait|n|an aspect of your personality|đặc điểm (tính cách)","unique|adj|unlike anything else|độc nhất","skilled|adj|very good at doing something|có kỹ năng, lành nghề","myth|n|a false belief|quan niệm sai, huyền thoại","exceptional|adj|unusually good; much better than average|xuất sắc","reject|v|to refuse to accept an idea or theory|bác bỏ","dishonest|adj|lacking in truth or honesty|không trung thực","controversial|adj|causing differences of opinion among people|gây tranh cãi","precise|adj|exact; accurate|chính xác","sample|n|a small amount to be studied or analyzed|mẫu (xét nghiệm)","extreme|adj|the greatest or strongest possible|cực đoan, khắc nghiệt","specific|adj|particular|cụ thể","heredity|n|how traits are passed from one generation to the next|di truyền","generation|n|a group of people born around the same time|thế hệ","cells|n|the smallest living parts of an animal or plant|tế bào","ethical|adj|good or correct behavior|đúng đạo đức"],
k:[["Vocab skill: Word Parts","Gốc: aud (nghe), hydro (nước), man (tay), psych (tâm trí), script (viết), bio (sống), -logy (nghiên cứu). Tiền tố: auto- (tự), dec- (mười), inter- (giữa), mis- (sai), super- (trên), uni- (một). VD: manual, interpersonal, mispronounce, automatic, psychiatrist, biography, audience."],["Note-taking: Know What to Write","Ghi: giải thích kỹ thuật (DNA…), ý được nhấn mạnh (This is important…, A key finding…), mục đánh số (The first point…), nhận xét cuối (We can conclude…)."],["Listening: Identify Facts and Opinions","Fact: có thể kiểm chứng (khoa học, lịch sử, tiểu sử…). Opinion: bắt đầu bằng I think/I believe, có tính từ nêu ý kiến (important, boring), hoặc động từ khuyên (should, ought to). Hỏi: 'Có ai không đồng ý không?' Nếu có → opinion."],["Speaking: Express Degrees of Certainty","Chắc nhất: I'm sure/positive that's true → I'm pretty sure → I think it's true, but I could be wrong → I'm not sure about that → I really don't know if that's true (kém chắc nhất)."],["Pronunciation: Elision of -t and -d","Âm cuối -t/-d thường không phát âm khi đứng trước phụ âm: didn't know, wanted to wait, thought the question…"],["Critical Thinking: Evaluate Online Materials","Hỏi: thông tin có mới không (current)? nguồn có đáng tin, tác giả là chuyên gia (reliable)? có chính xác, khớp các nguồn khác (accurate)? viết với mục đích gì – dạy, thuyết phục, bán hàng, giải trí (purpose)?"],["Presentation: Plan a Slide Presentation","Lập dàn ý trước khi làm slide; mỗi ý chính 1 slide; hình ảnh thú vị truyền đạt ý; kết thúc 1 slide tóm tắt; KHÔNG ghi mọi thứ lên slide. Online: biết share screen, ở chế độ presentation."],["Nội dung nghe/video","Nature vs. Nurture; OCEAN: Openness, Conscientiousness, Extroversion, Agreeableness, Neuroticism. Song sinh giống hệt chỉ giống ~50% đặc điểm tính cách; ~25,000 gene; hệ gen = genome; chromosome mang DNA. Mendel ~1865 nghiên cứu đậu (gen/di truyền). Không nên dùng xét nghiệm DNA online để chọn nghề."]],
g:[["SAY","Trước trích dẫn trực tiếp/gián tiếp: He said (that) it was hard. KHÔNG: say about."],["TELL","tell + người + chủ đề; tell a story/joke/lie/the truth; tell me (that)… KHÔNG: told that…"],["TALK","talk about / talk to. Không: talk English → speak English."],["DISCUSS","discuss + danh từ (không có 'about'): discussed the role of DNA."]],
q:[["The professor ___ about genetics. (talked / discussed about)","talked"],["Linh ___ me that she was sick. (said / told)","told"],["We ___ the role of DNA in class. (discussed / discussed about)","discussed"],["Ruby ___ a funny joke. (told / said)","told"]]},
{n:"Unit 3 – On the Move",
v:["category|n|a group of things with similar characteristics|nhóm, loại","combination|n|a mix of things|sự kết hợp","conflict|n|fights or wars|xung đột","citizen|n|a legal member of a country|công dân","establish|v|to start (a business, etc.)|thành lập","illustrate|v|to show with an example|minh họa","migration|n|movement of people from one place to another|sự di cư","natural disaster|n phr|environmental event that causes a lot of damage|thiên tai","poverty|n|being very poor|nghèo đói","settle|v|to stay permanently and make a new home|định cư","agriculture|n|keeping animals and growing plants for food|nông nghiệp","come up with|v phr|to find or produce (ideas)|nghĩ ra","growth|n|the process of getting bigger|sự tăng trưởng","ignore|v|to pay no attention to|phớt lờ","invest|v|to put money into a bank/business hoping for profit|đầu tư","potential|n|the ability to develop or succeed in the future|tiềm năng","refer to|v phr|to mention or talk about|đề cập đến","spread|n|covering or reaching more area or people|sự lan rộng","standard of living|n phr|a person's level of money and comfort|mức sống","supply|n|the amount available|nguồn cung","liberty|n|freedom to live the way you want|tự do","faith|n|a strong belief that something is good or true|niềm tin","gutsy|adj|brave (informal)|can đảm"],
k:[["Vocab skill: Context Clues","3 loại: (1) Synonym/antonym: establish, or start; (2) Definition/explanation: in other words…; (3) Example: for example…"],["Note-taking: Note Contrasting Ideas","Dùng bảng 2 cột cho ý đối lập. Push factors (đẩy đi: kinh tế, xã hội, môi trường – VD nạn đói, bệnh dịch ở Ireland thế kỷ 19) vs Pull factors (kéo đến: việc làm, cuộc sống an toàn, dễ chịu – VD Australia thế kỷ 20)."],["Listening: Recognize Signal Phrases","Bắt đầu: Let's get started. Nhắc lại: As we said in the last class. Chủ đề mới: Let's move on to… Thông tin chính: There are several key theories. Ví dụ: Let me give you a couple of examples. Kết thúc: That brings us to the end of today's lecture."],["Speaking: Refer to Numbers and Statistics","3 cách: (1) phần trăm/tỉ lệ: 20 percent, half of; (2) bội số: ten times as many, tripled; (3) con số: over three million. VD: 20% du học sinh không về nước."],["Pronunciation: Recognize Linking","Nối âm: phụ âm + nguyên âm (a list of); phụ âm + cùng phụ âm (cheap places); nguyên âm + nguyên âm (to owning)."],["Critical Thinking: Categorize Information","Xếp thông tin vào nhóm có đặc điểm giống nhau để người nghe dễ hiểu (VD push/pull; economic/social/environmental)."],["Collaboration: Acknowledge & Express Opinions","Ghi nhận: I hear what you're saying; I see your point; Let me make sure I understand; What I've understood is… Nêu ý kiến: I really think…, We strongly believe…, I definitely feel…, It is our firm belief that…"],["Nội dung","Out of Eden Walk của Paul Salopek: đi bộ 24,000 dặm từ Ethiopia (2013), 'slow journalism'. Ellis Island: 1892–1954, >12 triệu người nhập cư, 98% vượt qua kiểm tra. Brain drain: người có tay nghề/học vấn cao rời nước nghèo; ~20% du học sinh không về; Tonga có gần một nửa dân số sống ở nước ngoài."]],
g:[["Adjective clause – chủ ngữ","who/that cho người; that/which cho vật: a woman who moved to South America; a company that made clothes."],["Adjective clause – tân ngữ","whom/who/that (người), that/which (vật). Thường được lược bỏ: the documentary (that) you recommended."]],
q:[["I watched a video ___ my teacher recommended. (who/that)","that"],["It was about a woman ___ moved to South America. (who/which)","who"],["She started a company ___ made traditional clothes. (who/that)","that"]]},
{n:"Unit 4 – People and the Planet",
v:["appropriate|adj|correct or suitable for the situation|phù hợp","collapse|v|to fall down suddenly because of lack of strength or support|sụp đổ","dramatic|adj|causing a strong reaction when seen or experienced|ấn tượng mạnh","erosion|n|the loss of earth or rock as a result of wind or rain|sự xói mòn","eventually|adv|after a long time|cuối cùng, sau cùng","injury|n|harm done to a person's body|chấn thương","pressure|n|force or power that presses against or down|áp lực","risk|n|possible danger|rủi ro","surface|n|top part or outside of something|bề mặt","layer|n|something that covers what is below|lớp","analysis|n|careful examination of something|sự phân tích","apparently|adv|seems to be true|dường như","balance|n|giving equal importance to things|sự cân bằng","compromise|n|an agreement that does not completely satisfy anybody|sự thỏa hiệp","consultant|n|a person who provides expert advice|chuyên gia tư vấn","harm|v|to damage something or somebody|gây hại","impact|n|effect|tác động","in theory|phr|possible but may not happen|về lý thuyết","look into|v phr|to explore|xem xét, tìm hiểu","preserve|v|to keep something safe|bảo tồn","arid|adj|extremely dry, without rain|khô cằn","tapped|adj|used or used up (a resource)|bị khai thác hết","harness|v|to control something|khai thác, điều khiển","sustain|v|to support or care for|duy trì","endangered|adj|in danger of no longer existing|có nguy cơ tuyệt chủng"],
k:[["Listening: Strategies for New Words","Nghe: giải thích (Limestone is a rock formed when sea creatures die), từ đồng nghĩa (erode, or wash it away; cracks, or small breaks), dạng từ (weak → weakness)."],["Tsingy de Bemaraha (Madagascar)","Cảnh quan karst từ đá vôi (limestone). Nước mưa xói mòn → lỗ & vết nứt → hang nhỏ → hang lớn → đỉnh hang sập → tháp cao, hẻm sâu; hình thành các mũi nhọn như dao. Phi công so sánh với nhà chọc trời New York."],["Note-taking: Supporting Information","Ghi lý do, ví dụ/câu chuyện, số liệu, ý kiến, tên người/địa điểm, con số (ngày, %). Ecotourism: đánh giá cao thiên nhiên, giảm tác động môi trường."],["Vocab skill: Online Resources","Thesaurus (đồng/trái nghĩa), collocations dictionary (từ hay đi cùng: major impact, reach a compromise), concordancer (xem cách dùng từ trong câu thật)."],["Speaking: Agreement and Disagreement","Đồng ý hoàn toàn: I completely/really/totally agree with/that… Không đồng ý hoàn toàn: I strongly/really disagree with… Đồng ý một phần: I sort of agree with you, but… / I see what you mean, but…"],["Pronunciation: Which Word to Stress","Từ được nhấn mạnh thu hút sự chú ý và đổi nghĩa câu (Serena didn't want to go… – nhấn 'Serena' = Liam thì muốn; nhấn 'Iceland' = muốn đi nơi khác)."],["Critical Thinking: Think Creatively","Nghĩ càng nhiều giải pháp càng tốt. Cách: brainstorming, viết nhật ký, mind map. Sáng tạo xếp thứ 2 trong các kỹ năng tương lai theo nhà tuyển dụng."],["Presentation: Use Images","Một ảnh lớn ấn tượng tốt hơn nhiều ảnh nhỏ; nói rõ khán giả đang nhìn gì; mô tả slide. Online: đừng share screen cả bài, để khán giả thấy mặt bạn lúc đầu và cuối."],["Nội dung","Yellowstone: bison (~5,450 con năm 2021), xung đột với người → compromise. Colorado River: quan trọng nhưng nguy cấp. Giá trị ecotourism; Greenland: du lịch giúp bù thu nhập đánh cá nhưng ảnh hưởng môi trường/văn hóa."]],
g:[["Passive voice","be + past participle: This rock was formed millions of years ago. Tourists are not allowed to climb. Thêm 'by + tác nhân' khi cần: conducted by graduate students."],["Các thì bị động (phụ lục)","Present: is wasted | Past: was closed | Future: will be seen | Present perfect: have been read | Infinitive: has to be cleaned | Modal: should be put."]],
q:[["The Giant's Causeway ___ (form) from basalt rock.","is formed"],["It ___ (create) by the eruption of a volcano.","was created"],["Every year it ___ (visit) by nearly 1 million tourists.","is visited"],["The rock ___ (form) millions of years ago.","was formed"]]},

k:[["Vocab skill: Suffixes","Danh từ: -ness (kindness), -ment (amusement). Động từ: -ify (identify), -ize (criticize). Tính từ: -ive (alternative), -ous (dangerous)."],["Note-taking: Show a Sequence of Events","Dùng ô và mũi tên: 1958 Born → 1982 Graduated → 1983 Started work → 1986 New job. Satya Nadella: sinh ở Ấn Độ, bằng kỹ sư điện, bằng MBA ở Mỹ, vào Microsoft 1992. Basmah Abdulaziz Al-Mayman: Ả Rập Xê Út, quảng bá văn hóa/lịch sử (Al-Hijr)."],["Listening: Recognize Paraphrased Material","Cụm báo hiệu diễn đạt lại: What I mean by that is…, In other words…, Let me explain, By that, I mean…, Let me put it another way."],["Lời khuyên trong radio program","(1) Luôn nghĩ đến bước tiếp theo, (2) Tìm mentor, (3) Cẩn thận với hình ảnh online, (4) Là team player, (5) Tự định nghĩa thế nào là thành công."],["Speaking: Respond Thoughtfully","Khen câu hỏi: That's a really interesting/great question. Xin thời gian: Let me give that some thought / Let me think about that for a moment. Nhắc lại câu hỏi: Do you mean…? Are you asking…?"],["Pronunciation: Vowel /ɜr/","Viết là -er (her), -ur (Thursday), -or (word, work), -ir (bird), -ear (heard, learn, earn). Phân biệt: work–worn, first–fire, fur–furious, heard–ear."],["Critical Thinking: Recognize Bias","Bias = ý kiến một chiều, thường thiếu bằng chứng (do tuổi, giới, văn hóa, niềm tin). Cách phản hồi: (a) nhận ra ý kiến của người nói, rồi (b) đưa thông tin thực tế để cân bằng."],["Presentation: Body Language","Di chuyển nhẹ nhưng không đi qua lại; không đứng che màn hình; dùng tay nhấn ý nhưng không vẫy; nhìn khán giả theo hình chữ M hoặc W. Online: camera thấy đầu và phần trên cơ thể, hơi nghiêng người về phía trước."],["Nội dung","Howard Putnam: bắt đầu bốc hành lý, thành chủ tịch Southwest Airlines (1978), 'cheaper flights, fewer services'. Julie Deane (Cambridge): làm túi satchel cho con, khách hàng chủ yếu từ ngành thời trang."]],
g:[["Indirect questions","Dùng trật tự câu KHẲNG ĐỊNH (không đảo trợ động từ). Yes/no → if/whether. Wh- giữ từ hỏi. Lịch sự hơn."],["Ví dụ","Direct: What are these companies doing? → Can you explain what these companies are doing? | Does the company have an office? → Do you know if/whether the company has an office?"]],

and out (nổi bật), try out (thử)."],["Động từ bất quy tắc hay gặp","become–became–become, bite–bit–bitten, choose–chose–chosen, draw–drew–drawn, drive–drove–driven, forgive–forgave–forgiven, freeze–froze–frozen, hide–hid–hidden, ride–rode–ridden, speak–spoke–spoken, wake–woke–woken, write–wrote–written, swim–swam–swum, sing–sang–sung."]],

const app=document.getElementById('app'),tabs=document.getElementById('tabs'),modes=document.getElementById('modes');
let cur=0,mode='study';const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const parse=u=>u.v.map(s=>{const a=s.split('|');return a.length==4?{w:a[0],p:a[1],e:a[2],vn:a[3]}:{w:a[0],p:'',e:a[1],vn:a[2]}});
const pool=()=>cur<0?U.flatMap(parse):parse(U[cur]);
function mk(box,list,fn){box.innerHTML='';list.forEach(([t,i])=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>fn(i);b.className=fn.on(i)?'on':'';box.appendChild(b)})}
function draw(){
 const tl=U.map((u,i)=>[u.n.split(' –')[0],i]);tl.push(['Tất cả từ vựng',-1]);
 mk(tabs,tl,Object.assign(i=>{cur=i;draw()},{on:i=>i==cur}));
 mk(modes,[['Tổng hợp','study'],['Flashcard','fc'],['Trắc nghiệm','quiz']].map(([t,m])=>[t,m]),Object.assign(m=>{mode=m;draw()},{on:m=>m==mode}));
 if(cur<0&&mode=='study')mode='fc',draw();
 ({study,fc,quiz}[mode])();}
function study(){const u=U[cur],v=parse(u);let h=`<h2>${u.n}</h2>`;
 if(v.length)h+=`<h2>Từ vựng (${v.length})</h2><div class="card"><table><tr><th>Từ</th><th>Định nghĩa</th><th>Nghĩa</th></tr>${v.map(x=>`<tr><td class="w">${esc(x.w)} <span class="p">${x.p}</span></td><td>${esc(x.e)}</td><td class="vn">${x.vn}</td></tr>`).join('')}</table></div>`;
 h+=`<h2>Kỹ năng & kiến thức</h2>`+u.k.map(([t,d])=>`<div class="card"><b class="t">${esc(t)}</b>${esc(d)}</div>`).join('');
 if(u.g.length)h+=`<h2>Ngữ pháp</h2>`+u.g.map(([t,d])=>`<div class="card"><b class="t">${esc(t)}</b>${esc(d)}</div>`).join('');
 if(u.q.length)h+=`<h2>Tự kiểm tra ngữ pháp</h2><small>Bấm vào câu để xem đáp án.</small>`+u.q.map(([q,a])=>`<details class="card"><summary>${esc(q)}</summary><b class="vn">${esc(a)}</b></details>`).join('');
 app.innerHTML=h}
let fi=0,flip=false,deck=[];
function fc(){if(!deck.length||deck._c!=cur){deck=pool().sort(()=>Math.random()-.5);deck._c=cur;fi=0;flip=false}
 const x=deck[fi];app.innerHTML=`<h2>Flashcard ${fi+1}/${deck.length}</h2><div class="card fc" id="c" tabindex="0">${flip?`<div>${esc(x.e)}<br><span class="vn">${x.vn}</span></div>`:`<div><b>${esc(x.w)}</b><br><span class="p">${x.p}</span></div>`}</div><div class="row"><button id="pv">Trước</button><button id="fl">Lật thẻ</button><button id="nx">Tiếp</button><button id="sh">Xáo bài</button></div>`;
 const go=d=>{fi=(fi+d+deck.length)%deck.length;flip=false;fc()};
 c.onclick=fl.onclick=()=>{flip=!flip;fc()};pv.onclick=()=>go(-1);nx.onclick=()=>go(1);sh.onclick=()=>{deck=[];fc()}}
let qs=0,qn=0;
function quiz(){const p=pool();if(p.length<4){app.innerHTML='<p>Unit này không có từ vựng để làm trắc nghiệm.</p>';return}
 const x=p[Math.random()*p.length|0],all=cur<0?p:U.flatMap(parse),o=[x];
 while(o.length<4){const y=all[Math.random()*all.length|0];if(!o.some(z=>z.w==y.w))o.push(y)}
 o.sort(()=>Math.random()-.5);
 app.innerHTML=`<h2>Trắc nghiệm – điểm ${qs}/${qn}</h2><div class="card"><b>${esc(x.e)}</b><br><small>${x.vn}</small></div>`+o.map(y=>`<button class="opt" data-w="${esc(y.w)}">${esc(y.w)}</button>`).join('')+'<div class="row"><button id="nq" style="display:none">Câu tiếp</button></div>';
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(nq.style.display=='')return;qn++;const ok=b.dataset.w==esc(x.w);if(ok)qs++;b.classList.add(ok?'ok':'no');
  document.querySelectorAll('.opt').forEach(z=>{if(z.dataset.w==esc(x.w))z.classList.add('ok')});nq.style.display='';nq.focus()});
 nq.onclick=quiz}
draw();
</script></body></html>
